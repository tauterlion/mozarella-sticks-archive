name: Validate archive data

on:
  pull_request:
    paths:
      - "data/**"
      - "assets/media/**"
      - "tools/**"
      - "scripts/**"
      - "styles/**"
      - "*.html"
      - "tests/**"
      - ".github/workflows/validate-archive.yml"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "assets/media/**"
      - "tools/**"
      - "scripts/**"
      - "styles/**"
      - "*.html"
      - "tests/**"
      - ".github/workflows/validate-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate timeline, people, and media
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run archive validator
        run: python tools/validate_archive.py --check-files

      - name: Test media preservation safeguards
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check browser script syntax
        run: |
          for file in scripts/*.js tools/*.js; do
            node --check "$file" || exit 1
          done
