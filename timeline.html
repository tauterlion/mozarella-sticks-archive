<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mozarella Sticks interactive archive">
  <title>Timeline · Mozarella Sticks Archive</title>
  <link rel="stylesheet" href="styles/shared.css">
  <link rel="stylesheet" href="styles/timeline.css">
</head>
<body data-page="timeline">
  <a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <a class="brand" href="index.html" aria-label="Mozarella Sticks Archive home">
    <span class="brand-mark" aria-hidden="true">MS</span>
    <span><strong>Mozarella Sticks</strong><small>Archive</small></span>
  </a>
  <nav class="primary-nav" aria-label="Primary navigation">
    <a data-nav="home" href="index.html">Home</a>
    <a data-nav="timeline" href="timeline.html">Timeline</a>
    <a data-nav="gallery" href="gallery.html">Gallery</a>
  </nav>
  <button class="icon-button theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
    <span class="theme-icon" aria-hidden="true">◐</span>
  </button>
</header>

  <main id="main-content">
<section class="timeline-hero shell">
  <div>
    <p class="eyebrow">The chronology</p>
    <h1>Every era has a story.</h1>

  </div>
  <div class="timeline-summary" role="status" aria-live="polite"><strong id="visible-count">—</strong><span>events · Oldest first</span><button id="expand-all" class="button ghost" type="button">Expand all</button></div>
</section>

<div class="search-dock"><button id="search-launch" aria-haspopup="dialog" aria-controls="search-panel" aria-expanded="false"><svg class="search-symbol" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span id="search-prompt" aria-hidden="true">Search the archive</span><span id="search-total"></span></button></div>
<dialog id="search-panel" aria-labelledby="search-title">
 <header class="search-panel-header"><h2 id="search-title">Find a memory</h2><button id="search-close" class="icon-button" aria-label="Close search">×</button></header>
 <div class="search-input-wrap"><label class="sr-only" for="timeline-search">Search events, people, eras and descriptions</label><input id="timeline-search" type="search" autocomplete="off" placeholder="A person, place, or memory…" enterkeyhint="search"></div>
 <div class="search-panel-scroll">
 <button id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filter-drawer">Filters <span id="active-filter-count" hidden></span><span aria-hidden="true">⌄</span></button>
  <div id="filter-drawer" class="filter-drawer" data-open="false" aria-hidden="true">
    <div class="filter-drawer-inner">
      <div class="filter-field"><label for="era-filter">Filter by era</label><select id="era-filter"><option value="">All eras</option></select></div>
      <div class="filter-field"><label for="person-filter">Person</label><select id="person-filter"><option value="">All people</option></select></div>
      <div class="filter-field"><label for="category-filter">Category</label><select id="category-filter"><option value="">All categories</option></select></div>

      <fieldset class="segmented-field importance-field">
        <legend>Importance</legend>
        <label><input type="checkbox" name="importance" value="major" checked><span>Major</span></label>
        <label><input type="checkbox" name="importance" value="supporting" checked><span>Supporting</span></label>
        <label><input type="checkbox" name="importance" value="minor" checked><span>Minor</span></label>
      </fieldset>

      <fieldset class="segmented-field certainty-field">
        <legend>Date</legend>
        <label><input type="checkbox" name="certainty" value="confirmed" checked><span>Confirmed</span></label>
        <label><input type="checkbox" name="certainty" value="approximate" checked><span>Approximate</span></label>
        <label><input type="checkbox" name="certainty" value="range" checked><span>Range</span></label>
      </fieldset>

      <div class="control-actions">
        <button id="reset-filters" class="button ghost" type="button">Reset filters</button>

      </div>
    </div>
  </div>

 <div id="search-people" class="search-people"></div>
 <p id="search-status" role="status" aria-live="polite"></p>
 <div id="search-matches"></div>
 </div>
 <footer class="search-panel-footer"><button class="button primary" id="show-results">View events →</button></footer>
</dialog>
<div id="active-filters" class="active-filter-bar shell" hidden role="group" aria-label="Active timeline filters"></div>
<div id="current-era-status" class="current-era-status shell sr-only" hidden><span>Current era:</span><strong></strong></div>

<div class="timeline-layout shell">
  <aside class="era-jump" aria-label="Chapters">
    <p class="eyebrow">Chapters</p>
    <nav id="era-nav"></nav>
  </aside>
  <section id="timeline-root" class="timeline-root" tabindex="-1">
    <div class="loading-state">Loading timeline…</div>
  </section>
</div>
</main>

<footer class="site-footer">
  <p>A cleaned, community-approved archive. Raw chats and private evidence are not included.</p>
</footer>

  <script src="scripts/shared.js?v=2" defer></script>
  <script src="scripts/interactions.js" defer></script>
  <script src="scripts/timeline.js?v=2" defer></script>
</body>
</html>
